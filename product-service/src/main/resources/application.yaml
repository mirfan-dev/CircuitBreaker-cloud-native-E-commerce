server:
  port: 9099

spring:
  application:
    name: product-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/product-service}
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true          # dev only — move to application-dev.yml
    hibernate:
      ddl-auto: update      # dev only — use validate + migrations in prod
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # dialect auto-detected — removed

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

app:
  file:
    banner-path: uploads/product_banner/

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html3