server:
  port: 9091

spring:
  application:
    name: API-GATEWAY

  cloud:
    compatibility-verifier:
      enabled: false

    gateway:
      discovery:
        locator:
          enabled: false

      routes:
        # 1. Business API Routes (Protected by CustomRouteFilter)
        - id: USER-SERVICE
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**
          filters:
            - CustomRouteFilter

        - id: PRODUCT-SERVICE
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**,/api/categories/**
          filters:
            - CustomRouteFilter

        - id: INVENTORY-SERVICE
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/api/inventory/**
          filters:
            - CustomRouteFilter

        - id: ORDER-SERVICE
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/order/**
          filters:
            - CustomRouteFilter






eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: API GATEWAY SERVICE
        url: /v3/api-docs

      - name: USER-SERVICE
        url: /v3/api-docs/user-service

      - name: PRODUCT-SERVICE
        url: /v3/api-docs/product-service

      - name: INVENTORY-SERVICE
        url: /v3/api-docs/inventory-service

      - name: ORDER-SERVICE
        url: /v3/api-docs/order-service
