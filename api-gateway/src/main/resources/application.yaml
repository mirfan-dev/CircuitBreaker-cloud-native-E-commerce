
server:
  port: 9091

spring:
  application:
    name: API-GATEWAY

  cloud:
    compatibility-verifier:
      enabled: false

    gateway:
      discovery:
        locator:
          enabled: false

      routes:

        # ================= BUSINESS API ROUTES =================

        - id: USER-SERVICE
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**
          filters:
            - CustomRouteFilter

        - id: PRODUCT-SERVICE
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**,/api/categories/**
          filters:
            - CustomRouteFilter

        - id: INVENTORY-SERVICE
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/api/inventory/**
          filters:
            - CustomRouteFilter

        - id: ORDER-SERVICE
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/order/**
          filters:
            - CustomRouteFilter

        # ================= SWAGGER DOCUMENTATION ROUTES =================

        - id: USER-SERVICE-DOCS
          uri: lb://USER-SERVICE
          predicates:
            - Path=/service-docs/user-service
          filters:
            - RewritePath=/service-docs/user-service, /v3/api-docs

        - id: PRODUCT-SERVICE-DOCS
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/service-docs/product-service
          filters:
            - RewritePath=/service-docs/product-service, /v3/api-docs

        - id: INVENTORY-SERVICE-DOCS
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/service-docs/inventory-service
          filters:
            - RewritePath=/service-docs/inventory-service, /v3/api-docs

        - id: ORDER-SERVICE-DOCS
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/service-docs/order-service
          filters:
            - RewritePath=/service-docs/order-service, /v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000

springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    disable-swagger-default-url: true
    urls:
      - name: API GATEWAY SERVICE
        url: /v3/api-docs

      - name: USER-SERVICE
        url: /service-docs/user-service

      - name: PRODUCT-SERVICE
        url: /service-docs/product-service

      - name: INVENTORY-SERVICE
        url: /service-docs/inventory-service

      - name: ORDER-SERVICE
        url: /service-docs/order-service
