server:
  port: 9091

spring:
  application:
    name: api-gateway

  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      server:
        discovery:
          locator:
            enable: true
            lower-case-service-id: true




        routes:
          - id: user-service
            uri: lb://user-service
            predicates:
              - Path=/users/**
            filters:
              - CustomRouteFilter

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka